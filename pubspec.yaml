name: lembar
description: "Aplikasi belajar melalui course dan video lesson."
publish_to: none
version: 1.0.4+5

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: any
  material_ui: ^1.11.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  webview_flutter_android: ^4.14.1
  youtube_player_iframe: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    - assets/course-covers/
    - assets/data/
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
